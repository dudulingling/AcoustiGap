name: Build Windows Release Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Windows Executable & Package ZIP
        run: |
          python scripts/build_windows_exe.py

      - name: Upload Windows ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcoustiGap-Windows-x64-ZIP
          path: dist/AcoustiGap-Windows-x64.zip
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AcoustiGap-Windows-x64.zip
          generate_release_notes: true
